<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Disk cleanup review</title>
	<style>
		:root { color-scheme: light dark; font-family: var(--font-sans, system-ui, sans-serif); color: var(--color-text-primary, light-dark(#202938, #e5e9f0)); background: var(--color-background-primary, light-dark(#fff, #181c24)); }
		* { box-sizing: border-box; }
		body { margin: 0; padding: 20px; font-size: 14px; line-height: 1.5; }
		h1 { font-size: 22px; margin: 0 0 6px; }
		p { margin: 8px 0; }
		.muted, .metadata { color: var(--color-text-secondary, light-dark(#526174, #a9b5c7)); }
		#reviewed { font-size: 12px; }
		.toolbar, .candidate-header, footer { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
		.toolbar { margin: 20px 0 12px; justify-content: flex-start; }
		button { font: inherit; padding: 7px 12px; border-radius: 6px; border: 1px solid light-dark(#c6cfdd, #485569); cursor: pointer; background: transparent; color: inherit; }
		button:disabled { opacity: .5; cursor: default; }
		button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid #5795ef; outline-offset: 3px; }
		#cleanup { background: light-dark(#175acd, #296aca); color: #fff; border-color: transparent; }
		.candidate { border: 1px solid light-dark(#d2dbe7, #3b4555); border-radius: 9px; padding: 14px; margin-bottom: 12px; }
		.candidate.risky { border-left: 4px solid light-dark(#b75d00, #f2ac53); }
		label { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
		.candidate label { flex: 1; overflow-wrap: anywhere; }
		input { margin-top: 5px; accent-color: #397dec; flex-shrink: 0; }
		.size { font-size: 18px; font-weight: 650; white-space: nowrap; }
		.metadata { font-size: 12px; }
		summary { cursor: pointer; }
		details { margin-top: 12px; font-size: 13px; overflow-wrap: anywhere; }
		#risk-area { padding: 12px; border: 1px solid light-dark(#b75d00, #f2ac53); border-radius: 6px; margin: 12px 0; }
		footer { border-top: 1px solid light-dark(#d2dbe7, #3b4555); padding-top: 14px; }
		#status { overflow-wrap: anywhere; }
		[hidden] { display: none !important; }
	</style>
</head>
<body>
	<h1 id="title">Disk cleanup review</h1>
	<p id="scope" class="muted">Waiting for recommendations...</p>
	<p id="reviewed" class="muted"></p>
	<p>Select directories to ask the agent to clean up. The app submits a prompt; it never deletes files directly.</p>
	<div class="toolbar">
		<button id="select-recoverable" type="button">Select recoverable</button>
		<button id="clear" type="button">Clear selection</button>
	</div>
	<section id="candidates" aria-label="Cleanup candidates"></section>
	<div id="risk-area" hidden>
		<label><input id="acknowledge" type="checkbox">I understand the selected warnings. Ask the agent to review these entries; actual data loss still requires separate approval.</label>
	</div>
	<footer>
		<strong id="selection">0 selected / 0.0 MiB estimated</strong>
		<button id="cleanup" type="button" disabled>Clean up selected</button>
	</footer>
	<p id="status" role="status" aria-live="polite"></p>
	<script type="module">/* APP_SCRIPT */</script>
</body>
</html>
